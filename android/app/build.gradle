apply plugin: 'com.android.application'

android {
    namespace = 'com.manedsoftware.wolphun'
    compileSdk = 36
    buildToolsVersion = "36.0.0"
    // NDK r28 builds 16 KB page-size compatible native libraries by default.
    ndkVersion = project.findProperty('wolphunNdkVersion') ?: '28.2.13676358'

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId = "com.manedsoftware.wolphun"
        minSdk = 24              // Android 7.0 remains supported.
        targetSdk = 36           // Android 16 privacy/security behavior.
        versionCode = 4
        versionName = "0.3.0-beta"

        // NDK: synth de SoundFont (.sf2) em C -> TinySoundFont + TinyMidiLoader
        externalNativeBuild {
            cmake {
                cppFlags "-O2"
            }
        }
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version = "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'
}
